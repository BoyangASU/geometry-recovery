[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stfft"
version = "1.0.0"
description = "Spatial-Temporal Fast Fourier Transform for manufacturing thermography: data-quality improvement and geometric-information recovery."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Boyang Xu", email = "boyangxu@asu.edu" },
    { name = "Shenghan Guo" },
]
keywords = ["thermography", "fft", "image-quality", "geometry-recovery", "manufacturing", "smart-manufacturing"]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "opencv-python>=4.5",
    "pandas>=1.3",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
notebook = ["jupyter", "seaborn", "tqdm", "scikit-image", "statsmodels"]

[project.urls]
Repository = "https://github.com/BoyangASU/st-fft"

[tool.setuptools.packages.find]
where = ["src"]
